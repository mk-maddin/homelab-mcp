[project]
name = "homelab-mcp"
version = "0.1.0"
description = "Read-only MCP server for inspecting a Linux home server's health over the network"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0.0",
    "psutil>=6.0.0",
    "docker>=7.0.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.37.0",
]

[project.scripts]
homelab-mcp = "homelab_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_mcp"]
